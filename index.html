<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zephyr Member Manager</title>

     <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>
          body{
            font-family: 'Gill Sans';
            background-image: url("https://i.pinimg.com/736x/f8/02/5e/f8025ea3c6b7b94618591339a3ec00d7.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
          }

       .form-container {
           padding: 30px;
            border-radius: 15px;
            margin: auto;
            width: 450px;
            box-shadow: 0 4px 10px rgb(111, 158, 199);
            background-color:rgb(198, 232, 237);
            color:  rgb(254, 254, 254);
       }

       #header2{
        color: rgb(254, 254, 254);
        font-family: "Trebuchet MS", sans-serif;
       }

        #header{
        color: rgb(12, 69, 176);
        font-family: Impact, sans-serif;
       }

       #output2{
        font-family: "Trebuchet MS", sans-serif;
        padding: 30px;
        border-radius: 15px;
        margin: auto;
        width: 400px;
        box-shadow: rgb(233, 231, 231);
        background-color:rgb(44, 91, 152);
        color:  rgb(254, 254, 254);
       }


       #copyright{
        color: white;
        background-color: rgb(198, 232, 237);
       }

       #logo{
        display: block;
        width: 120px;
        height: auto;
        margin: 20px auto;
       }

    </style>
</head>
<body>
     <img src="zephyr.png" alt="Zephyr logo" id="logo">

    <h1 id="header" class="text-center">
    Dance Club</h1>

    <h5 id="header2" class="text-center">
    Student Club Member Management System</h1>

    <div class="form-container">

        <form>

            <h5 class="mb-4">🪩Add a Club Member:</h3>

            <input type="text"
                    id="first"
                    class="form-control"
                    placeholder="First Name"
                    aria-label="First Name"
                    required>
            <br>
             <input type="text"
                    id="last"
                    class="form-control"
                    placeholder="Last Name"
                    aria-label="Last Name"
                    required>
            <br>

            <div class="text-center">
                 <button type="button" id="btnadd" py-click="add_member" class="btn btn-light "> ADD MEMBER</button>
            
            <br>
            <br>
                 <div id="output2" class="text-center">
                    Your club member list will appear here.
                 </div>
            </div>
        </form>
    </div>
    
    <div>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <p id="copyright" class="text-center">© 2026 Zephyr | Dani Sandoval 10-Topaz</p>

    <script type="py" src="main.py"></script>
 </div>
</body>
</html>
